<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <nav>Personal Expense Tracker</nav>

  <main>
    <h1>Financial Dashboard</h1>
    <p>Manage your income and expenses in one place.</p>

    <section class="summary" aria-label="Financial summary">
      <article class="card">
        <h2>Total Income</h2>
        <strong id="totalIncome">LKR 0.00</strong>
      </article>

      <article class="card">
        <h2>Total Expenses</h2>
        <strong id="totalExpenses">LKR 0.00</strong>
      </article>

      <article class="card">
        <h2>Current Balance</h2>
        <strong id="balance">LKR 0.00</strong>
      </article>
    </section>

    <section class="panel">
      <h2>Add a Transaction</h2>

      <form id="transactionForm">
        <div class="grid">
          <label>
            Transaction Type
            <select id="type" required>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </label>

          <label>
            Description
            <input id="description" type="text"
                   placeholder="e.g. Monthly allowance" required>
          </label>

          <label>
            Amount (LKR)
            <input id="amount" type="number"
                   min="0.01" step="0.01"
                   placeholder="Enter amount" required>
          </label>

          <label>
            Category
            <select id="category" required>
              <option value="">Select a category</option>
              <option>Allowance</option>
              <option>Salary</option>
              <option>Food</option>
              <option>Transport</option>
              <option>Education</option>
              <option>Entertainment</option>
              <option>Shopping</option>
              <option>Bills</option>
              <option>Other</option>
            </select>
          </label>

          <label>
            Transaction Date
            <input id="date" type="date" required>
          </label>
        </div>

        <div class="buttons">
          <button type="submit">Add Transaction</button>
          <button type="button" id="clearButton" class="secondary">
            Clear Form
          </button>
        </div>
      </form>

      <p id="message" role="status"></p>
    </section>

    <section class="panel">
      <h2>Transaction History</h2>

      <div class="grid">
        <label>
          Filter by Type
          <select id="filter">
            <option value="all">All Transactions</option>
            <option value="income">Income Only</option>
            <option value="expense">Expenses Only</option>
          </select>
        </label>

        <label>
          Search Transactions
          <input id="search" type="search"
                 placeholder="Search by description or category">
        </label>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Type</th>
              <th>Category</th>
              <th>Amount (LKR)</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="transactionTable"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
